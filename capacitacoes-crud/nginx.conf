# Headers de segurança compartilhados.
#
# Importante: no nginx, a diretiva `add_header` definida em um nível NÃO é
# herdada por um bloco filho (location) que possua seus próprios `add_header`.
# Por isso os headers de segurança são centralizados neste arquivo e incluídos
# explicitamente (`include`) em cada `location` que precisa deles.
#   -> ver security-headers.conf
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Remove a versão do nginx das respostas e da página de erro
    server_tokens off;

    # ── Compressão ───────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml font/woff2;

    # ── Roteamento da SPA ──────────────────────────────────────────────────────
    # Qualquer rota desconhecida cai no index.html (roteamento client-side).
    location / {
        include    /etc/nginx/security-headers.conf;
        try_files  $uri $uri/ /index.html;
    }

    # ── Cache de assets com hash (imutáveis) ────────────────────────────────────
    location /assets/ {
        include    /etc/nginx/security-headers.conf;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # ── index.html nunca é cacheado (garante deploys imediatos) ────────────────
    location = /index.html {
        include    /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
