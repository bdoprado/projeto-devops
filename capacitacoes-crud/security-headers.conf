# Headers de segurança aplicados a todas as respostas HTTP.
# Incluído via `include` em cada bloco location do nginx.conf.
add_header X-Frame-Options         "SAMEORIGIN"                                always;
add_header X-Content-Type-Options  "nosniff"                                   always;
add_header Referrer-Policy         "strict-origin-when-cross-origin"           always;
add_header Permissions-Policy      "geolocation=(), microphone=(), camera=()"  always;
add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
