name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint e Testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitacoes-crud

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: capacitacoes-crud/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de dependências (SCA)
        # Shift-left: falha apenas em vulnerabilidades high/critical.
        # As moderadas são reportadas no log sem quebrar o build.
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test
